name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 * * 0,5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          curl -X GET "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/places?select=id&limit=1" \
          -H "apikey: ${{ secrets.NEXT_SERVICE_ROLE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.NEXT_SERVICE_ROLE_KEY }}"
